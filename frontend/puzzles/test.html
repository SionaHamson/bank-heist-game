<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Guard's Locker - Bank Heist</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #10141a;
            color: white;
            font-family: Arial, sans-serif;
        }

        .locker {
            width: 90%;
            max-width: 500px;
            padding: 30px;
            background: #1c222b;
            border: 2px solid #555;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.7);
        }

        h1 {
            color: #d6b45c;
        }

        .clue {
            margin: 20px 0;
            padding: 20px;
            background: #11161d;
            border-radius: 10px;
        }

        .alphabet {
            font-size: 18px;
            margin: 20px 0;
            letter-spacing: 3px;
        }

        input {
            width: 100px;
            padding: 12px;
            font-size: 22px;
            text-align: center;
            border-radius: 8px;
            border: none;
            margin: 10px;
        }

        button {
            padding: 12px 25px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        #message {
            margin-top: 20px;
            font-size: 18px;
            min-height: 30px;
        }

        #digit {
            font-size: 35px;
            font-weight: bold;
            margin-top: 15px;
        }
    </style>
</head>

<body>

    <div class="locker">

        <h1>🔐 GUARD'S LOCKER</h1>

        <div class="clue">
            <p><strong>The guard never writes his password directly.</strong></p>

            <p>
                "I only need the letter that comes after G."
            </p>

            <div class="alphabet">
                A=1 &nbsp; B=2 &nbsp; C=3 &nbsp; D=4<br>
                E=5 &nbsp; F=6 &nbsp; G=7 &nbsp; H=8
            </div>
        </div>

        <p>Enter the number:</p>

        <input type="number" id="answer" min="0" max="9">

        <br>

        <button onclick="unlockLocker()">🔓 UNLOCK</button>

        <div id="message"></div>

        <div id="digit"></div>

    </div>

    <script src="puzzle.js"></script>

    <script>

        let attempts = 3;

        function unlockLocker() {

            const answer = document.getElementById("answer").value;

            if (answer === "") {
                document.getElementById("message").textContent =
                    "⚠️ Enter an answer first.";
                return;
            }

            const result = checkLockerAnswer(answer);

            if (result.correct) {

                document.getElementById("message").textContent =
                    result.message;

                document.getElementById("digit").textContent =
                    "SECOND DIGIT: " + result.digit;

            } else {

                attempts--;

                document.getElementById("message").textContent =
                    result.message + " Attempts left: " + attempts;

                if (attempts === 0) {

                    document.getElementById("message").textContent =
                        "🚨 No attempts left!";

                }
            }
        }

    </script>

</body>
</html>
